<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhóm - Mạng Xã Hội Mini</title>
  <link rel="stylesheet" href="css/style.css?v=20261115-mobile-nav1">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <style>
    .groups-layout { display:grid; grid-template-columns:280px minmax(0,1fr); gap:16px; width:100%; max-width:1100px; margin:0 auto; padding:16px; align-items:start; }
    .groups-left { position:fixed; z-index:90; left:max(16px,calc((100vw - 1100px) / 2 + 16px)); top:76px; bottom:16px; width:280px; overflow-y:auto; scrollbar-width:thin; }
    .groups-right { grid-column:2; min-width:0; }
    .groups-nav { background:var(--card-bg,#fff); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .groups-nav button, .groups-nav a {
      display:flex; align-items:center; gap:10px; width:100%; text-align:left;
      padding:10px 12px; border:none; background:transparent; border-radius:8px;
      cursor:pointer; font-size:.92rem; color:var(--text-main); text-decoration:none;
      min-height:42px; box-sizing:border-box; transition:background-color .15s ease,color .15s ease;
    }
    .groups-nav button:hover, .groups-nav a:hover, .groups-nav button.active { background:rgba(0,132,255,.1); color:#0084ff; }
    .groups-nav .create-btn { background:#e7f3ff; color:#0084ff; font-weight:600; margin-top:8px; }
    .groups-nav .create-btn:hover { background:#d8ebff; }
    .group-open-btn {
      flex:0 0 auto; border:0; border-radius:8px; padding:9px 14px;
      background:var(--primary); color:#fff; font:inherit; font-weight:600;
      cursor:pointer; white-space:nowrap; transition:background-color .15s ease,box-shadow .15s ease;
    }
    .group-open-btn:hover { background:#5420b5; box-shadow:0 3px 10px rgba(84,32,181,.2); }
    .groups-load-more {
      display:block; width:100%; margin:12px 0; padding:11px;
      border:1px solid var(--border-color); border-radius:9px;
      background:var(--bg-surface); color:var(--primary); font:inherit; font-weight:600;
      cursor:pointer;
    }
    .groups-load-more:disabled { opacity:.7; cursor:wait; }
    .groups-section-title { font-size:.78rem; color:var(--text-muted); margin:14px 8px 6px; font-weight:600; text-transform:uppercase; }
    .group-list-item { display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; }
    .group-list-item:hover { background:rgba(0,0,0,.04); }
    .group-list-item img { width:40px; height:40px; border-radius:8px; object-fit:cover; background:#eee; }
    .group-list-item .meta { flex:1; min-width:0; }
    .group-list-item .name { font-weight:600; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .group-list-item .sub { font-size:.75rem; color:var(--text-muted); }
    .group-feed-card { background:var(--card-bg,#fff); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .group-feed-card .author { display:flex; gap:10px; align-items:center; margin-bottom:8px; }
    .group-feed-card .author img { width:40px; height:40px; border-radius:50%; }
    .pending-badge { display:inline-block; background:#fef3c7; color:#92400e; font-size:.72rem; padding:2px 8px; border-radius:999px; margin-left:6px; }
    .create-group-modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:9999; }
    .create-group-modal.show { display:flex; }
    .create-group-box { background:var(--card-bg,#fff); border-radius:14px; padding:20px; width:min(420px,92vw); }
    .create-group-box h3 { margin:0 0 12px; }
    .create-group-box label { display:block; font-size:.82rem; font-weight:600; margin:10px 0 4px; }
    .create-group-box input, .create-group-box textarea, .create-group-box select {
      width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border,#ddd); box-sizing:border-box;
    }
    .create-group-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
    .create-group-actions button { min-height:40px; }
    .group-avatar-picker { display:flex; align-items:center; gap:12px; }
    .group-avatar-preview { width:64px; height:64px; border-radius:12px; object-fit:cover; background:var(--bg-surface-secondary); border:1px solid var(--border-color); }
    .group-avatar-file-label { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:8px 12px; border-radius:8px; color:var(--text-main); background:var(--bg-surface-secondary); font-weight:600; cursor:pointer; }
    .group-avatar-file-label:hover { background:var(--bg-surface-hover); }
    .composer-box { background:var(--card-bg,#fff); border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    .group-composer-title { width:100%; margin-bottom:8px; border:1px solid var(--border,#ddd); border-radius:8px; padding:10px; box-sizing:border-box; font:inherit; font-weight:600; color:var(--text-main); background:var(--bg-surface); }
    .composer-box textarea { width:100%; min-height:70px; border:1px solid var(--border,#ddd); border-radius:8px; padding:8px; box-sizing:border-box; resize:vertical; }
    .group-post-card { gap:12px; }
    .group-post-card .post-header-left { cursor:pointer; }
    .group-post-title { margin:0 0 8px; font-size:1.15rem; line-height:1.35; }
    .group-post-card .post-content { word-break:break-word; }
    .group-post-card .post-stats > div { display:flex; align-items:center; gap:5px; }
    .group-post-card .post-stats > div:last-child { cursor:pointer; }
    .group-post-card .reaction-btn-wrapper { min-width:0; }
    .group-comment-modal .comment-modal-post-content:empty { display:none; }
    .group-comment-modal .comment-modal-actions { display:none; }
    @media (max-width:760px) {
      .groups-layout { display:flex; flex-direction:column; padding:12px; }
      .groups-left { position:sticky; left:auto; top:120px; bottom:auto; z-index:90; width:100%; max-height:42vh; overflow-y:auto; }
      .groups-right { width:100%; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <a href="index.html" class="logo-container">
        <div class="logo-icon logo-svg-box" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 20C14 11.1634 21.1634 4 30 4H70C78.8366 4 86 11.1634 86 20V62C86 70.8366 78.8366 78 70 78H36L14 94L20 78H30C21.1634 78 14 70.8366 14 62V20Z" fill="#6c2bd9"/>
            <line x1="50" y1="28" x2="30" y2="58" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="30" y1="58" x2="70" y2="58" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
            <line x1="70" y1="58" x2="50" y2="28" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
            <circle cx="50" cy="28" r="10" fill="#f59e0b"/>
            <circle cx="50" cy="28" r="4.5" fill="white"/>
            <circle cx="30" cy="58" r="10" fill="#ec4899"/>
            <circle cx="30" cy="58" r="4.5" fill="white"/>
            <circle cx="70" cy="58" r="10" fill="#10b981"/>
            <circle cx="70" cy="58" r="4.5" fill="white"/>
          </svg>
        </div>
        <span>Mạng Xã Hội Mini</span>
      </a>
    </div>
    <div class="nav-right">
      <button class="btn-icon theme-toggle" id="themeToggleBtn" title="Chuyển chế độ">🌙</button>
      <a href="admin.html" class="btn-icon" id="adminPanelBtn" title="Trang Quản Trị Viên" style="display:none;text-decoration:none;">🛡️</a>
      <div class="nav-dropdown-wrapper">
        <button class="btn-icon" id="notificationBtn" title="Thông báo" onclick="app.toggleNotificationDropdown()">
          🔔<span class="badge-counter" id="unreadNotifCount" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notificationDropdown" style="display:none;">
          <div class="notif-dropdown-header">
            <h4>Thông báo</h4>
            <button onclick="app.markAllNotificationsRead()">Đã đọc tất cả</button>
          </div>
          <div class="notif-list" id="notifList">
            <div style="padding:1rem;text-align:center;color:var(--text-muted);font-size:.85rem;">Không có thông báo mới</div>
          </div>
        </div>
      </div>
      <a href="friends.html?tab=requests" class="btn-icon" id="friendRequestsBtn" title="Lời mời kết bạn" style="text-decoration:none;">
        👥<span class="badge-counter" id="friendRequestsCount" style="display:none;">0</span>
      </a>
      <a class="btn-icon" id="quickChatBtn" href="messenger.html" title="Tin nhắn" style="text-decoration:none;">💬</a>
      <div class="user-nav-badge" id="navUserBadge" onclick="app.openMyProfile()">
        <img id="navAvatar" src="/img/default-avatar.svg" alt="Avatar">
        <span id="navFullname">Đang tải...</span>
      </div>
      <button class="btn-icon" id="logoutBtn" title="Đăng xuất" style="color:var(--accent-red);">🚪</button>
    </div>
  </header>

  <div class="groups-layout">
    <aside class="groups-left">
      <div class="groups-nav" id="groupsSideNav">
        <a href="index.html" class="groups-nav-link">📰 Bảng tin chính</a>
        <a href="friends.html" class="groups-nav-link">👥 Bạn bè</a>
        <div class="groups-section-title">Nhóm</div>
        <button class="active" id="navFeed" onclick="groupsPage.showFeed()">📋 Hoạt động nhóm</button>
        <button id="navMine" onclick="groupsPage.showMine()">🏠 Nhóm của tôi</button>
        <button id="navDiscover" onclick="groupsPage.showDiscover()">🧭 Khám phá nhóm</button>
        <button id="navSearch" onclick="groupsPage.showSearch()">🔎 Tìm kiếm nhóm</button>
        <button id="navInvites" onclick="groupsPage.showInvites()">📨 Lời mời tham gia</button>
        <button id="navManage" onclick="groupsPage.showManage()">⚙️ Quản lý nhóm</button>
        <button class="create-btn" id="navCreate" onclick="groupsPage.openCreateModal()">＋ Tạo nhóm mới</button>
        <div class="groups-section-title">Nhóm bạn đã tham gia</div>
        <div id="joinedGroupsList"><div style="padding:8px;color:var(--text-muted);font-size:.85rem;">Đang tải...</div></div>
      </div>
    </aside>
    <main class="groups-right">
      <div id="groupsMainTitle" style="font-size:1.15rem;font-weight:700;margin-bottom:12px;">Hoạt động mới đây</div>
      <div id="groupComposer" class="composer-box" style="display:none;">
        <input type="text" id="groupPostTitle" class="group-composer-title" maxlength="100" placeholder="Tiêu đề bài viết (không bắt buộc)">
        <textarea id="groupPostContent" placeholder="Viết gì đó cho nhóm..."></textarea>
        <div id="groupMediaPreview" style="display:none;margin-top:8px;"></div>
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;">
          <div style="display:flex;gap:8px;">
            <label class="btn-attach" style="cursor:pointer;">📷 Ảnh<input type="file" id="groupImageFile" accept="image/*" style="display:none" onchange="groupsPage.handleImage(this)"></label>
            <label class="btn-attach" style="cursor:pointer;">🎥 Video<input type="file" id="groupVideoFile" accept="video/*" style="display:none" onchange="groupsPage.handleVideo(this)"></label>
            <button type="button" class="btn-attach" onclick="groupsPage.pendingGifTarget='group'; app.openGifPicker('post'); setTimeout(()=>{},0)">GIF</button>
          </div>
          <button class="btn-primary" onclick="groupsPage.submitPost()">Đăng bài</button>
        </div>
      </div>
      <div id="groupsContent"><div style="padding:20px;color:var(--text-muted);">Đang tải...</div></div>
    </main>
  </div>

  <div class="create-group-modal" id="createGroupModal">
    <div class="create-group-box">
      <h3>Tạo nhóm mới</h3>
      <label>Tên nhóm *</label>
      <input id="cgName" type="text" maxlength="80" placeholder="Nhập tên nhóm">
      <label>Mô tả</label>
      <textarea id="cgDesc" rows="3" placeholder="Mô tả ngắn về nhóm"></textarea>
      <label for="cgAvatarFile">Ảnh đại diện nhóm</label>
      <div class="group-avatar-picker">
        <img id="cgAvatarPreview" class="group-avatar-preview" src="/img/default-avatar.svg" alt="Xem trước ảnh nhóm">
        <label class="group-avatar-file-label">📁 Chọn ảnh
          <input id="cgAvatarFile" type="file" accept="image/*" hidden onchange="groupsPage.handleGroupAvatar(this)">
        </label>
        <button type="button" class="btn-secondary" id="cgAvatarRemove" onclick="groupsPage.clearGroupAvatar()" style="display:none;">Gỡ ảnh</button>
      </div>
      <label>Quyền riêng tư</label>
      <select id="cgPrivacy">
        <option value="PUBLIC">Công khai</option>
        <option value="PRIVATE">Riêng tư</option>
      </select>
      <div class="create-group-actions">
        <button type="button" class="btn-secondary" onclick="groupsPage.closeCreateModal()">Hủy</button>
        <button type="button" class="btn-primary" onclick="groupsPage.createGroup()">Tạo nhóm</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay group-comment-modal" id="groupCommentModal" style="display:none;" onclick="if(event.target === this) groupsPage.closeGroupComments()">
    <div class="comment-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="groupCommentTitle">
      <div class="comment-modal-header">
        <span id="groupCommentTitle">Bình luận bài viết</span>
        <button type="button" class="btn-icon" aria-label="Đóng" onclick="groupsPage.closeGroupComments()">✕</button>
      </div>
      <div class="comment-modal-body">
        <div class="comment-modal-post-author">
          <img id="groupCommentPostAvatar" src="/img/default-avatar.svg" alt="Ảnh đại diện">
          <div>
            <div id="groupCommentPostAuthor" style="font-weight:700;font-size:.95rem;">--</div>
            <div id="groupCommentPostTime" style="font-size:.78rem;color:var(--text-muted);">--</div>
          </div>
        </div>

        <div class="modal-overlay group-post-edit-modal" id="groupPostEditModal" style="display:none;" onclick="if(event.target === this) groupsPage.closeEditPost()">
          <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="groupPostEditTitle" style="width:min(560px,92vw);">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
              <h2 id="groupPostEditTitle" style="font-size:1.15rem;">Chỉnh sửa bài viết</h2>
              <button type="button" class="btn-icon" aria-label="Đóng" onclick="groupsPage.closeEditPost()">✕</button>
            </div>
            <input id="groupPostEditTitleInput" type="text" maxlength="100" aria-label="Tiêu đề bài viết" placeholder="Tiêu đề bài viết (không bắt buộc)" style="width:100%;padding:12px;margin-bottom:8px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface-secondary);color:var(--text-main);">
            <textarea id="groupPostEditContent" rows="6" maxlength="10000" aria-label="Nội dung bài viết" style="width:100%;padding:12px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface-secondary);color:var(--text-main);resize:vertical;"></textarea>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
              <button type="button" class="btn-secondary" onclick="groupsPage.closeEditPost()">Hủy</button>
              <button type="button" class="btn-primary" onclick="groupsPage.saveEditedPost()">Lưu thay đổi</button>
            </div>
          </div>
        </div>
        <div id="groupCommentPostContent" class="comment-modal-post-content"></div>
        <div id="groupCommentPostMedia" class="comment-modal-post-media"></div>
        <div class="comment-modal-stats">
          <span id="groupCommentReactionCount">0 lượt cảm xúc</span>
          <span><span id="groupCommentCount">0</span> bình luận</span>
        </div>
        <div id="groupCommentList" class="comment-list-container">
          <div style="padding:16px;text-align:center;color:var(--text-muted);">Đang tải bình luận...</div>
        </div>
      </div>
      <div class="comment-modal-footer">
        <div class="comment-input-row">
          <img id="groupCommentMyAvatar" src="/img/default-avatar.svg" alt="Ảnh đại diện của bạn">
          <input id="groupCommentInput" type="text" placeholder="Viết bình luận công khai..." onkeydown="if(event.key === 'Enter') groupsPage.sendGroupComment()">
          <button type="button" aria-label="Gửi bình luận" onclick="groupsPage.sendGroupComment()">➤</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=20261115-mobile-nav1"></script>
  <script>
    const groupsPage = {
      currentView: 'feed',
      currentGroupId: null,
      myGroups: [],
      feedLimit: 10,
      feedPageSize: 5,
      feedOffset: 0,
      feedHasMore: false,
      feedLoading: false,
      feedRequestId: 0,
      feedObserver: null,
      seenPostIds: new Set(),
      postsById: new Map(),
      activeCommentPostId: null,
      groupAvatarData: '',
      editingPostId: null,
      groupCommentsById: new Map(),

      async init() {
        if (!app.currentUser) {
          setTimeout(() => this.init(), 300);
          return;
        }
        await this.loadJoined();
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('group_id');
        if (groupId) {
          this.openGroup(groupId);
          return;
        }
        const view = (params.get('view') || 'feed').toLowerCase();
        if (view === 'mine') this.showMine();
        else if (view === 'manage') this.showManage();
        else if (view === 'discover') this.showDiscover();
        else if (view === 'create') { this.showFeed(); this.openCreateModal(); }
        else if (view === 'search') this.showSearch();
        else if (view === 'invites') this.showInvites();
        else this.showFeed();
      },

      setActiveNav(id) {
        this.stopFeedPagination();
        document.querySelectorAll('.groups-nav button').forEach(b => b.classList.remove('active'));
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      },

      stopFeedPagination() {
        this.feedRequestId++;
        if (this.feedObserver) {
          this.feedObserver.disconnect();
          this.feedObserver = null;
        }
        this.feedLoading = false;
      },

      observeFeedSentinel() {
        if (!this.feedHasMore || !('IntersectionObserver' in window)) return;
        const sentinel = document.getElementById('groupsLoadMoreSentinel');
        if (!sentinel) return;
        if (this.feedObserver) this.feedObserver.disconnect();
        this.feedObserver = new IntersectionObserver(entries => {
          if (entries.some(entry => entry.isIntersecting)) this.loadMorePosts();
        }, { rootMargin: '0px 0px 120px 0px' });
        this.feedObserver.observe(sentinel);
      },

      async showSearch() {
        this.currentView = 'search';
        this.currentGroupId = null;
        this.setActiveNav('navSearch');
        document.getElementById('groupsMainTitle').textContent = 'Tìm kiếm nhóm';
        document.getElementById('groupComposer').style.display = 'none';
        const box = document.getElementById('groupsContent');
        box.innerHTML = `
          <div style="margin-bottom:12px;">
            <input type="text" id="groupSearchInput" placeholder="Nhập tên nhóm..." 
              style="width:100%;max-width:420px;padding:.65rem .9rem;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-surface);color:var(--text-main);"
              oninput="groupsPage.filterDiscover(this.value)">
          </div>
          <div id="groupSearchResults"><div style="padding:12px;color:var(--text-muted);">Đang tải danh sách nhóm...</div></div>`;
        const requestId = this.feedRequestId;
        const results = document.getElementById('groupSearchResults');
        try {
          const res = await fetch(`/api/community-groups/discover?user_id=${encodeURIComponent(app.currentUser.id)}`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể tìm kiếm nhóm.');
          if (requestId === this.feedRequestId) this.renderDiscoverGroups(data.groups || [], results);
        } catch (error) {
          if (requestId !== this.feedRequestId) return;
          console.error('Không thể tải nhóm để tìm kiếm:', error);
          results.innerHTML = '<div style="padding:12px;color:var(--accent-red);">Không thể tải danh sách nhóm.</div>';
          app.showToast('Không thể tải danh sách nhóm.', 'error');
        }
      },

      filterDiscover(q) {
        const term = (q || '').trim().toLowerCase();
        document.querySelectorAll('#groupsContent .group-feed-card, #groupSearchResults .group-feed-card').forEach(card => {
          const text = (card.textContent || '').toLowerCase();
          card.style.display = !term || text.includes(term) ? '' : 'none';
        });
      },

      async showInvites() {
        this.currentView = 'invites';
        this.currentGroupId = null;
        this.setActiveNav('navInvites');
        document.getElementById('groupsMainTitle').textContent = 'Lời mời tham gia nhóm';
        document.getElementById('groupComposer').style.display = 'none';
        const box = document.getElementById('groupsContent');
        box.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-muted);">
          Hiện chưa có lời mời tham gia nhóm nào.<br>
          <span style="font-size:.85rem;">Bạn có thể khám phá nhóm công khai và gửi yêu cầu tham gia.</span>
          <div style="margin-top:14px;"><button class="btn-primary" onclick="groupsPage.showDiscover()">🧭 Khám phá nhóm</button></div>
        </div>`;
      },

      async showManage() {
        await this.showMine('navManage', 'Quản lý nhóm đã tham gia');
      },

      async loadJoined() {
        const res = await fetch(`/api/community-groups/my?user_id=${encodeURIComponent(app.currentUser.id)}`);
        const data = await res.json();
        this.myGroups = data.groups || [];
        const box = document.getElementById('joinedGroupsList');
        if (!this.myGroups.length) {
          box.innerHTML = '<div style="padding:8px;color:var(--text-muted);font-size:.85rem;">Chưa tham gia nhóm nào.</div>';
          return;
        }
        box.innerHTML = this.myGroups.map(g => `
          <div class="group-list-item" onclick="groupsPage.openGroup('${g.id}')">
            <img src="${app.escapeHtml(g.avatar || '/img/default-avatar.svg')}" onerror="this.src='/img/default-avatar.svg'">
            <div class="meta">
              <div class="name">${app.escapeHtml(g.name)}</div>
              <div class="sub">${g.member_count || 0} thành viên · ${g.privacy === 'PRIVATE' ? 'Riêng tư' : 'Công khai'}</div>
            </div>
          </div>
        `).join('');
      },

      async showFeed() {
        this.currentView = 'feed';
        this.currentGroupId = null;
        this.setActiveNav('navFeed');
        this.feedOffset = 0;
        this.feedHasMore = true;
        this.seenPostIds = new Set();
        this.postsById = new Map();
        const requestId = this.feedRequestId;
        document.getElementById('groupsMainTitle').textContent = 'Hoạt động mới đây';
        document.getElementById('groupComposer').style.display = 'none';
        const box = document.getElementById('groupsContent');
        box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Đang tải...</div>';
        try {
          const res = await fetch(`/api/community-groups/feed?user_id=${encodeURIComponent(app.currentUser.id)}&limit=${this.feedLimit}&offset=0`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Yêu cầu tải bảng tin bị từ chối.');
          if (requestId !== this.feedRequestId) return;
          const posts = Array.isArray(data.posts) ? data.posts : [];
          this.feedOffset = posts.length;
          this.feedHasMore = posts.length === this.feedLimit;
          this.renderPosts(posts);
        } catch (error) {
          if (requestId !== this.feedRequestId) return;
          console.error('Không thể tải bảng tin nhóm:', error);
          box.innerHTML = '<div style="padding:20px;color:var(--accent-red);">Không thể tải bảng tin nhóm.</div>';
          app.showToast('Không thể tải bảng tin nhóm.', 'error');
        }
      },

      async showDiscover() {
        this.currentView = 'discover';
        this.currentGroupId = null;
        this.setActiveNav('navDiscover');
        const requestId = this.feedRequestId;
        document.getElementById('groupsMainTitle').textContent = 'Khám phá nhóm';
        document.getElementById('groupComposer').style.display = 'none';
        const box = document.getElementById('groupsContent');
        box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Đang tải...</div>';
        try {
          const res = await fetch(`/api/community-groups/discover?user_id=${encodeURIComponent(app.currentUser.id)}`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể tải nhóm khám phá.');
          if (requestId !== this.feedRequestId) return;
          this.renderDiscoverGroups(data.groups || [], box);
        } catch (error) {
          if (requestId !== this.feedRequestId) return;
          console.error('Không thể tải nhóm khám phá:', error);
          box.innerHTML = '<div style="padding:20px;color:var(--accent-red);">Không thể tải danh sách nhóm.</div>';
          app.showToast('Không thể tải danh sách nhóm.', 'error');
        }
      },

      renderDiscoverGroups(groups, box) {
        if (!groups.length) {
          box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Chưa có nhóm công khai nào. Hãy tạo nhóm mới!</div>';
          return;
        }
        box.innerHTML = groups.map(g => `
          <div class="group-feed-card" style="display:flex;gap:12px;align-items:center;">
            <img src="${app.escapeHtml(g.avatar || '/img/default-avatar.svg')}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;" onerror="this.src='/img/default-avatar.svg'">
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;">${app.escapeHtml(g.name)}</div>
              <div style="font-size:.82rem;color:var(--text-muted);">${g.member_count || 0} thành viên · ${g.privacy === 'PRIVATE' ? 'Riêng tư' : 'Công khai'}</div>
              <div style="font-size:.85rem;margin-top:4px;">${app.escapeHtml(g.description || '')}</div>
            </div>
            ${g.is_member
              ? `<button onclick="groupsPage.openGroup('${g.id}')">Xem</button>`
              : `<button class="btn-primary" onclick="groupsPage.joinGroup('${g.id}')">Tham gia</button>`}
          </div>
        `).join('');
      },

      async showMine(navId = 'navMine', title = 'Nhóm của bạn') {
        this.currentView = navId === 'navManage' ? 'manage' : 'mine';
        this.currentGroupId = null;
        this.setActiveNav(navId);
        const requestId = this.feedRequestId;
        await this.loadJoined();
        if (requestId !== this.feedRequestId) return;
        document.getElementById('groupsMainTitle').textContent = title;
        document.getElementById('groupComposer').style.display = 'none';
        const box = document.getElementById('groupsContent');
        if (!this.myGroups.length) {
          box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Bạn chưa tham gia nhóm nào.</div>';
          return;
        }
        box.innerHTML = this.myGroups.map(g => `
          <div class="group-feed-card" style="display:flex;gap:12px;align-items:center;">
            <img src="${app.escapeHtml(g.avatar || '/img/default-avatar.svg')}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;" onerror="this.src='/img/default-avatar.svg'">
            <div style="flex:1;">
              <div style="font-weight:700;">${app.escapeHtml(g.name)} ${g.role === 'ADMIN' ? '<span class="pending-badge">Admin</span>' : ''}</div>
              <div style="font-size:.82rem;color:var(--text-muted);">${g.member_count || 0} thành viên</div>
            </div>
            <button class="group-open-btn" onclick="groupsPage.openGroup('${g.id}')">Mở nhóm</button>
          </div>
        `).join('');
      },

      async openGroup(groupId) {
        this.stopFeedPagination();
        this.currentView = 'group';
        this.currentGroupId = groupId;
        this.feedOffset = 0;
        this.feedHasMore = true;
        this.seenPostIds = new Set();
        this.postsById = new Map();
        const requestId = this.feedRequestId;
        document.querySelectorAll('.groups-nav button').forEach(b => b.classList.remove('active'));
        const g = this.myGroups.find(x => x.id === groupId);
        document.getElementById('groupsMainTitle').textContent = g ? g.name : 'Nhóm';
        document.getElementById('groupComposer').style.display = 'block';
        const box = document.getElementById('groupsContent');
        box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Đang tải...</div>';
        let pendingHtml = '';
        try {
          if (g && g.role === 'ADMIN') {
            const pr = await fetch(`/api/community-groups/posts/pending?group_id=${encodeURIComponent(groupId)}&admin_id=${encodeURIComponent(app.currentUser.id)}`);
            const pd = await pr.json();
            if (!pr.ok || pd.status !== 'ok') throw new Error(pd.message || 'Không thể tải bài viết chờ duyệt.');
            if (requestId !== this.feedRequestId) return;
            const pending = pd.posts || [];
            if (pending.length) {
              pendingHtml = `<div class="group-feed-card" style="border:1px solid #fbbf24;"><strong>Bài chờ duyệt (${pending.length})</strong>` +
                pending.map(p => `
                  <div style="margin-top:10px;padding-top:10px;border-top:1px solid #eee;">
                  <div style="font-size:.85rem;"><strong>${app.escapeHtml(p.author_name)}</strong>${p.title ? `<div style="font-weight:700;margin-top:4px;">${app.escapeHtml(p.title)}</div>` : ''}<div>${app.escapeHtml(p.content || '')}</div></div>
                    <div style="margin-top:6px;display:flex;gap:8px;">
                      <button class="btn-primary" onclick="groupsPage.approvePost('${p.id}', true)">Duyệt</button>
                      <button onclick="groupsPage.approvePost('${p.id}', false)">Từ chối</button>
                    </div>
                  </div>
                `).join('') + '</div>';
            }
          }
          const res = await fetch(`/api/community-groups/feed?user_id=${encodeURIComponent(app.currentUser.id)}&group_id=${encodeURIComponent(groupId)}&limit=${this.feedLimit}&offset=0`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Yêu cầu tải bài viết nhóm bị từ chối.');
          if (requestId !== this.feedRequestId) return;
          const posts = Array.isArray(data.posts) ? data.posts : [];
          this.feedOffset = posts.length;
          this.feedHasMore = posts.length === this.feedLimit;
          this.renderPosts(posts, pendingHtml);
        } catch (error) {
          if (requestId !== this.feedRequestId) return;
          console.error('Không thể tải bài viết nhóm:', error);
          box.innerHTML = pendingHtml + '<div style="padding:20px;color:var(--accent-red);">Không thể tải bài viết nhóm.</div>';
          app.showToast('Không thể tải bài viết nhóm.', 'error');
        }
      },

      media: { type: 'NONE', url: '' },

      handleImage(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          this.media = { type: 'IMAGE', url: reader.result };
          const box = document.getElementById('groupMediaPreview');
          box.style.display = 'block';
          box.innerHTML = `<img src="${reader.result}" style="max-width:100%;border-radius:10px;">`;
        };
        reader.readAsDataURL(file);
      },
      handleVideo(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          this.media = { type: 'VIDEO', url: reader.result };
          const box = document.getElementById('groupMediaPreview');
          box.style.display = 'block';
          box.innerHTML = `<video src="${reader.result}" controls style="max-width:100%;border-radius:10px;"></video>`;
        };
        reader.readAsDataURL(file);
      },
      clearMedia() {
        this.media = { type: 'NONE', url: '' };
        const box = document.getElementById('groupMediaPreview');
        if (box) { box.style.display = 'none'; box.innerHTML = ''; }
        const img = document.getElementById('groupImageFile'); if (img) img.value = '';
        const vid = document.getElementById('groupVideoFile'); if (vid) vid.value = '';
      },

      renderPosts(posts, extraHtml = '', append = false) {
        const box = document.getElementById('groupsContent');
        if (!append && !posts.length && !extraHtml) {
          box.innerHTML = '<div style="padding:20px;color:var(--text-muted);">Chưa có bài viết nào.</div>';
          return;
        }
        const postsHtml = posts.map(post => {
          const p = this.postsById.get(post.id) || post;
          this.postsById.set(p.id, p);
          this.seenPostIds.add(p.id);
          return this.renderGroupPost(p);
        }).join('');
        document.getElementById('groupsLoadMoreSentinel')?.remove();
        if (append) box.insertAdjacentHTML('beforeend', postsHtml);
        else box.innerHTML = extraHtml + postsHtml;
        if (this.feedHasMore) {
          box.insertAdjacentHTML('beforeend', '<button type="button" class="groups-load-more" id="groupsLoadMoreSentinel" onclick="groupsPage.loadMorePosts()">Xem thêm bài viết</button>');
          if (!this.feedLoading) this.observeFeedSentinel();
        }
      },

      renderGroupPost(post) {
        const idArg = app.jsArg(post.id);
        const reaction = post.my_reaction || '';
        const reactionTypes = [
          ['LIKE', '👍', 'Thích'], ['LOVE', '💗', 'Yêu thích'], ['HAHA', '😆', 'Haha'],
          ['WOW', '😮', 'Wow'], ['SAD', '😢', 'Buồn'], ['ANGRY', '😡', 'Phẫn nộ']
        ];
        const selected = reactionTypes.find(([type]) => type === reaction);
        const actionIcon = selected ? selected[1] : '👍';
        const actionLabel = selected ? selected[2] : 'Thích';
        const reactionClass = selected ? ` reacted-${selected[0].toLowerCase()}` : '';
        const isAuthor = post.author_id === app.currentUser.id;
        const isAdmin = this.myGroups.some(group => group.id === post.group_id && group.role === 'ADMIN');
        const canDelete = isAuthor || isAdmin;
        const media = app.renderPostMedia
          ? app.renderPostMedia(post.media_type, post.media_url, 'post-media-box')
          : '';
        const actions = post.approval_status === 'APPROVED' ? `
          <div class="post-stats">
            <div><span>${reaction ? actionIcon : '👍'}</span><span>${Number(post.reaction_count) || 0}</span></div>
            <div onclick="groupsPage.openGroupComments(${idArg})">💬 ${Number(post.comments_count) || 0} bình luận</div>
          </div>
          <div class="post-actions">
            <div class="reaction-btn-wrapper">
              <button type="button" class="btn-post-action${reactionClass}" onclick="groupsPage.react(${idArg}, ${app.jsArg(reaction || 'LIKE')})">
                <span>${actionIcon}</span><span>${actionLabel}</span>
              </button>
              <div class="reaction-popover">
                ${reactionTypes.map(([type, icon, label]) =>
                  `<span class="reaction-item" role="button" tabindex="0" title="${label}" aria-label="${label}" onclick="groupsPage.react(${idArg}, ${app.jsArg(type)})">${icon}</span>`
                ).join('')}
              </div>
            </div>
            <button type="button" class="btn-post-action" onclick="groupsPage.openGroupComments(${idArg})">
              <span>💬</span><span>Bình luận</span>
            </button>
            <button type="button" class="btn-post-action" onclick="groupsPage.shareToFeed(${idArg})">
              <span>📨</span><span>Chia sẻ</span>
            </button>
          </div>
        ` : '';
        return `
          <article class="post-card group-post-card" id="group-post-${app.escapeHtml(post.id)}">
            <div class="post-header">
              <div class="post-header-left" onclick="app.openUserProfile(${app.jsArg(post.user_token || post.author_id)})">
                <img src="${app.escapeHtml(post.author_avatar || '/img/default-avatar.svg')}" alt="Ảnh đại diện" onerror="this.src='/img/default-avatar.svg'">
                <div>
                  <div class="post-author-name">${app.escapeHtml(post.author_name || '')}
                    ${post.approval_status === 'PENDING' ? '<span class="pending-badge">Chờ duyệt</span>' : ''}
                  </div>
                  <div class="post-time">🕒 ${app.formatTimeAgo(post.created_at)} · ${app.escapeHtml(post.group_name || '')}</div>
                </div>
              </div>
              <div class="post-more-wrapper">
                <button type="button" class="post-more-btn" aria-label="Tùy chọn bài viết" onclick="groupsPage.togglePostMenu(event, ${idArg})">•••</button>
                <div class="post-more-dropdown" id="group-post-menu-${app.escapeHtml(post.id)}">
                  ${isAuthor ? `<button type="button" class="post-dropdown-item" onclick="groupsPage.openEditPost(${idArg})"><span>✏️</span> Chỉnh sửa</button>` : ''}
                  ${canDelete
                    ? `<button type="button" class="post-dropdown-item text-danger" onclick="groupsPage.deletePost(${idArg})"><span>🗑️</span> Xóa bài viết</button>`
                    : `<button type="button" class="post-dropdown-item" onclick="groupsPage.hidePost(${idArg})"><span>👁️</span> Ẩn bài viết</button>
                       <button type="button" class="post-dropdown-item" onclick="app.openReportModal('', ${idArg})"><span>🚩</span> Báo cáo</button>`}
                </div>
              </div>
            </div>
            ${post.title ? `<h3 class="group-post-title">${app.escapeHtml(post.title)}</h3>` : ''}
            ${post.content ? `<div class="post-content">${app.escapeHtml(post.content)}</div>` : ''}
            ${media}
            ${actions}
          </article>`;
      },

      updateGroupPostCard(post) {
        const card = document.getElementById(`group-post-${post.id}`);
        if (!card) return;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = this.renderGroupPost(post);
        const updatedCard = wrapper.firstElementChild;
        if (updatedCard) card.replaceWith(updatedCard);
      },

      async loadMorePosts() {
        if (this.feedLoading || !this.feedHasMore || (this.currentView !== 'feed' && this.currentView !== 'group')) return;
        this.feedLoading = true;
        let shouldObserveAgain = true;
        const requestId = this.feedRequestId;
        const groupId = this.currentGroupId || '';
        const sentinel = document.getElementById('groupsLoadMoreSentinel');
        if (sentinel) {
          sentinel.disabled = true;
          sentinel.textContent = 'Đang tải thêm bài viết...';
        }
        try {
          const params = new URLSearchParams({
            user_id: app.currentUser.id,
            limit: String(this.feedPageSize),
            offset: String(this.feedOffset)
          });
          if (groupId) params.set('group_id', groupId);
          const res = await fetch(`/api/community-groups/feed?${params}`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Yêu cầu tải thêm bài viết bị từ chối.');
          if (requestId !== this.feedRequestId) return;
          const posts = Array.isArray(data.posts) ? data.posts : [];
          this.feedOffset += posts.length;
          this.feedHasMore = posts.length === this.feedPageSize;
          this.renderPosts(posts.filter(post => !this.seenPostIds.has(post.id)), '', true);
        } catch (error) {
          if (requestId !== this.feedRequestId) return;
          console.error('Không thể tải thêm bài viết nhóm:', error);
          const retryButton = document.getElementById('groupsLoadMoreSentinel');
          if (retryButton) {
            retryButton.disabled = false;
            retryButton.textContent = 'Thử tải lại';
          }
          if (this.feedObserver) {
            this.feedObserver.disconnect();
            this.feedObserver = null;
          }
          shouldObserveAgain = false;
          app.showToast('Không thể tải thêm bài viết nhóm.', 'error');
        } finally {
          if (requestId === this.feedRequestId) {
            this.feedLoading = false;
            if (shouldObserveAgain) this.observeFeedSentinel();
          }
        }
      },

      togglePostMenu(event, postId) {
        event?.stopPropagation();
        event?.preventDefault();
        const menu = document.getElementById(`group-post-menu-${postId}`);
        const wasOpen = menu?.classList.contains('show');
        document.querySelectorAll('.group-post-card .post-more-dropdown.show').forEach(item => item.classList.remove('show'));
        if (!wasOpen) menu?.classList.add('show');
      },

      async react(postId, type) {
        const post = this.postsById.get(postId);
        if (!post) return;
        const currentReaction = post.my_reaction || '';
        const nextReaction = currentReaction === type ? 'NONE' : type;
        try {
          const res = await fetch('/api/community-groups/posts/reaction', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ post_id: postId, user_id: app.currentUser.id, type: nextReaction })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể cập nhật cảm xúc.');
          if (!currentReaction && nextReaction !== 'NONE') post.reaction_count = (Number(post.reaction_count) || 0) + 1;
          else if (currentReaction && nextReaction === 'NONE') post.reaction_count = Math.max(0, (Number(post.reaction_count) || 0) - 1);
          post.my_reaction = nextReaction === 'NONE' ? '' : nextReaction;
          this.updateGroupPostCard(post);
        } catch (error) {
          console.error('Không thể cập nhật cảm xúc bài viết nhóm:', error);
          app.showToast(error.message || 'Không thể cập nhật cảm xúc.', 'error');
        }
      },

      async openGroupComments(postId) {
        const post = this.postsById.get(postId);
        if (!post) return;
        this.activeCommentPostId = postId;
        document.getElementById('groupCommentTitle').textContent = `Bài viết của ${post.author_name || ''}`;
        document.getElementById('groupCommentPostAvatar').src = post.author_avatar || '/img/default-avatar.svg';
        document.getElementById('groupCommentPostAuthor').textContent = post.author_name || '';
        document.getElementById('groupCommentPostTime').textContent = `🕒 ${app.formatTimeAgo(post.created_at)}`;
        document.getElementById('groupCommentPostContent').textContent = [post.title, post.content].filter(Boolean).join('\n\n');
        document.getElementById('groupCommentPostMedia').innerHTML = app.renderPostMedia
          ? app.renderPostMedia(post.media_type, post.media_url, 'post-media-box')
          : '';
        document.getElementById('groupCommentReactionCount').textContent = `${Number(post.reaction_count) || 0} lượt cảm xúc`;
        document.getElementById('groupCommentCount').textContent = Number(post.comments_count) || 0;
        document.getElementById('groupCommentMyAvatar').src = app.currentUser.avatar || '/img/default-avatar.svg';
        document.getElementById('groupCommentInput').value = '';
        document.getElementById('groupCommentList').innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);">Đang tải bình luận...</div>';
        document.getElementById('groupCommentModal').style.display = 'flex';
        document.getElementById('groupCommentInput').focus();
        await this.loadGroupComments(postId);
      },

      closeGroupComments() {
        document.getElementById('groupCommentModal').style.display = 'none';
        this.activeCommentPostId = null;
      },

      async loadGroupComments(postId) {
        try {
          const params = new URLSearchParams({ post_id: postId, user_id: app.currentUser.id });
          const res = await fetch(`/api/community-groups/posts/comments?${params}`);
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể tải bình luận.');
          if (this.activeCommentPostId !== postId) return;
          const comments = Array.isArray(data.comments) ? data.comments : [];
          this.groupCommentsById = new Map(comments.map(comment => [comment.id, comment]));
          document.getElementById('groupCommentCount').textContent = comments.length;
          const post = this.postsById.get(postId);
          if (post) post.comments_count = comments.length;
          document.getElementById('groupCommentList').innerHTML = comments.length ? comments.map(comment => {
            const reactionTypes = [
              ['LIKE', '👍', 'Thích'], ['LOVE', '❤️', 'Yêu thích'], ['HAHA', '😆', 'Haha'],
              ['WOW', '😮', 'Wow'], ['SAD', '😢', 'Buồn'], ['ANGRY', '😡', 'Phẫn nộ']
            ];
            const selected = reactionTypes.find(([type]) => type === comment.my_reaction);
            const reactionIcon = selected ? selected[1] : '👍';
            const commentIdArg = app.jsArg(comment.id);
            return `
              <div class="comment-item-wrap">
                <div class="comment-item">
                  <img class="c-avatar" src="${app.escapeHtml(comment.author_avatar || '/img/default-avatar.svg')}" alt="Ảnh đại diện">
                  <div class="comment-bubble">
                    <div class="c-author">${app.escapeHtml(comment.author_name || '')}</div>
                    <div class="c-text">${app.formatCommentContentHtml(comment.content || '')}</div>
                  </div>
                </div>
                <div class="comment-actions-bar">
                  <span>${app.formatTimeAgo(comment.created_at)}</span>
                  <span class="comment-reaction-wrap">
                    <button type="button" class="comment-action-btn comment-reaction-trigger${selected ? ' reacted' : ''}" onclick="groupsPage.reactToGroupComment(${commentIdArg}, ${app.jsArg(comment.my_reaction || 'LIKE')})" title="${selected ? selected[2] : 'Thích'}">${reactionIcon}</button>
                    <span class="comment-reaction-picker">
                      ${reactionTypes.map(([type, icon, label]) => `<button type="button" class="comment-reaction-option" title="${label}" aria-label="${label}" onclick="groupsPage.reactToGroupComment(${commentIdArg}, ${app.jsArg(type)})">${icon}</button>`).join('')}
                    </span>
                  </span>
                  ${Number(comment.total_reactions) > 0 ? `<span class="comment-reaction-count">${Number(comment.total_reactions)}</span>` : ''}
                  <button type="button" class="comment-action-btn" onclick="groupsPage.replyToGroupComment(${app.jsArg(comment.author_name || '')})">Phản hồi</button>
                </div>
              </div>`;
          }).join('') : '<div style="padding:20px;text-align:center;color:var(--text-muted);">Chưa có bình luận nào. Hãy là người đầu tiên bình luận!</div>';
          if (post) this.updateGroupPostCard(post);
        } catch (error) {
          if (this.activeCommentPostId !== postId) return;
          console.error('Không thể tải bình luận bài viết nhóm:', error);
          document.getElementById('groupCommentList').innerHTML = '<div style="padding:16px;text-align:center;color:var(--accent-red);">Không thể tải bình luận.</div>';
          app.showToast(error.message || 'Không thể tải bình luận.', 'error');
        }
      },

      replyToGroupComment(authorName) {
        const input = document.getElementById('groupCommentInput');
        input.value = `@${authorName} `;
        input.focus();
      },

      async reactToGroupComment(commentId, type) {
        const postId = this.activeCommentPostId;
        if (!postId) return;
        const currentReaction = this.groupCommentsById.get(commentId)?.my_reaction || '';
        const nextType = currentReaction === type ? 'NONE' : type;
        try {
          const res = await fetch('/api/community-groups/posts/comments/reaction', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ comment_id: commentId, user_id: app.currentUser.id, type: nextType })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể cập nhật cảm xúc bình luận.');
          await this.loadGroupComments(postId);
        } catch (error) {
          console.error('Không thể cập nhật cảm xúc bình luận nhóm:', error);
          app.showToast(error.message || 'Không thể cập nhật cảm xúc bình luận.', 'error');
        }
      },

      async sendGroupComment() {
        const postId = this.activeCommentPostId;
        const input = document.getElementById('groupCommentInput');
        const content = input.value.trim();
        if (!postId || !content) return;
        try {
          const res = await fetch('/api/community-groups/posts/comment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ post_id: postId, author_id: app.currentUser.id, content })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể gửi bình luận.');
          input.value = '';
          const post = this.postsById.get(postId);
          if (post) {
            post.comments_count = (Number(post.comments_count) || 0) + 1;
            this.updateGroupPostCard(post);
          }
          await this.loadGroupComments(postId);
        } catch (error) {
          console.error('Không thể gửi bình luận bài viết nhóm:', error);
          app.showToast(error.message || 'Không thể gửi bình luận.', 'error');
        }
      },

      openEditPost(postId) {
        const post = this.postsById.get(postId);
        if (!post || post.author_id !== app.currentUser.id) return;
        this.editingPostId = postId;
        document.getElementById('groupPostEditTitleInput').value = post.title || '';
        document.getElementById('groupPostEditContent').value = post.content || '';
        document.getElementById('groupPostEditModal').style.display = 'flex';
        document.getElementById('groupPostEditTitleInput').focus();
      },

      closeEditPost() {
        document.getElementById('groupPostEditModal').style.display = 'none';
        this.editingPostId = null;
      },

      async saveEditedPost() {
        const postId = this.editingPostId;
        const post = this.postsById.get(postId);
        const title = document.getElementById('groupPostEditTitleInput').value.trim();
        const content = document.getElementById('groupPostEditContent').value.trim();
        if (!post || (!title && !content)) {
          app.showToast('Nhập tiêu đề hoặc nội dung bài viết.', 'error');
          return;
        }
        try {
          const res = await fetch('/api/community-groups/posts/edit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ post_id: postId, user_id: app.currentUser.id, title, content })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể cập nhật bài viết.');
          post.title = title;
          post.content = content;
          this.updateGroupPostCard(post);
          this.closeEditPost();
          app.showToast('Đã cập nhật bài viết.', 'success');
        } catch (error) {
          console.error('Không thể cập nhật bài viết nhóm:', error);
          app.showToast(error.message || 'Không thể cập nhật bài viết.', 'error');
        }
      },

      async deletePost(postId) {
        const post = this.postsById.get(postId);
        if (!post || !await app.showConfirm('Bạn có chắc muốn xóa bài viết này?')) return;
        try {
          const res = await fetch('/api/community-groups/posts/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ post_id: postId, user_id: app.currentUser.id })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể xóa bài viết.');
          this.postsById.delete(postId);
          this.seenPostIds.delete(postId);
          this.feedOffset = Math.max(0, this.feedOffset - 1);
          document.getElementById(`group-post-${postId}`)?.remove();
          app.showToast('Đã xóa bài viết.', 'success');
        } catch (error) {
          console.error('Không thể xóa bài viết nhóm:', error);
          app.showToast(error.message || 'Không thể xóa bài viết.', 'error');
        }
      },

      hidePost(postId) {
        const card = document.getElementById(`group-post-${postId}`);
        if (!card) return;
        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.96)';
        window.setTimeout(() => card.remove(), 300);
        this.postsById.delete(postId);
        this.seenPostIds.delete(postId);
        app.showToast('Đã ẩn bài viết khỏi bảng tin nhóm.', 'info');
      },

      async shareToFeed(postId) {
        const thoughts = prompt('Nội dung kèm theo khi chia sẻ (có thể để trống):');
        if (thoughts === null) return;
        try {
          const res = await fetch('/api/community-groups/posts/share-to-feed', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ post_id: postId, user_id: app.currentUser.id, thoughts })
          });
          const data = await res.json();
          if (!res.ok || data.status !== 'ok') throw new Error(data.message || 'Không thể chia sẻ bài viết.');
          app.showToast(data.message || 'Đã chia sẻ bài viết.', 'success');
        } catch (error) {
          console.error('Không thể chia sẻ bài viết nhóm:', error);
          app.showToast(error.message || 'Không thể chia sẻ bài viết.', 'error');
        }
      },

      openCreateModal() { document.getElementById('createGroupModal').classList.add('show'); },

      closeCreateModal() {
        document.getElementById('createGroupModal').classList.remove('show');
        document.getElementById('cgName').value = '';
        document.getElementById('cgDesc').value = '';
        document.getElementById('cgPrivacy').value = 'PUBLIC';
        this.clearGroupAvatar();
      },

      handleGroupAvatar(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          app.showToast('Vui lòng chọn tệp hình ảnh.', 'error');
          input.value = '';
          return;
        }
        if (file.size > 3 * 1024 * 1024) {
          app.showToast('Ảnh đại diện không được lớn hơn 3 MB.', 'error');
          input.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result !== 'string') {
            app.showToast('Không thể đọc tệp ảnh đã chọn.', 'error');
            input.value = '';
            return;
          }
          this.groupAvatarData = reader.result;
          document.getElementById('cgAvatarPreview').src = reader.result;
          document.getElementById('cgAvatarRemove').style.display = 'inline-flex';
        };
        reader.onerror = () => {
          app.showToast('Không thể đọc tệp ảnh đã chọn.', 'error');
          input.value = '';
        };
        reader.readAsDataURL(file);
      },

      clearGroupAvatar() {
        this.groupAvatarData = '';
        const input = document.getElementById('cgAvatarFile');
        if (input) input.value = '';
        const preview = document.getElementById('cgAvatarPreview');
        if (preview) preview.src = '/img/default-avatar.svg';
        const removeButton = document.getElementById('cgAvatarRemove');
        if (removeButton) removeButton.style.display = 'none';
      },

      async createGroup() {
        const name = document.getElementById('cgName').value.trim();
        const description = document.getElementById('cgDesc').value.trim();
        const avatar = this.groupAvatarData;
        const privacy = document.getElementById('cgPrivacy').value;
        if (!name) { app.showToast('Vui lòng nhập tên nhóm', 'error'); return; }
        const res = await fetch('/api/community-groups/create', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name, description, avatar, privacy, created_by: app.currentUser.id })
        });
        const data = await res.json();
        if (data.status !== 'ok') { app.showToast(data.message || 'Lỗi tạo nhóm', 'error'); return; }
        app.showToast('Tạo nhóm thành công!', 'success');
        this.closeCreateModal();
        await this.loadJoined();
        this.openGroup(data.group.id);
      },

      async joinGroup(groupId) {
        const res = await fetch('/api/community-groups/join', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ group_id: groupId, user_id: app.currentUser.id })
        });
        const data = await res.json();
        if (data.status !== 'ok') { app.showToast(data.message || 'Không thể tham gia', 'error'); return; }
        app.showToast('Đã tham gia nhóm!', 'success');
        await this.loadJoined();
        this.openGroup(groupId);
      },

      async submitPost() {
        if (!this.currentGroupId) return;
        const title = document.getElementById('groupPostTitle').value.trim();
        const content = document.getElementById('groupPostContent').value.trim();
        // Nếu user chọn GIF qua picker post, lấy từ app.currentMedia
        if (app.currentMedia && app.currentMedia.type === 'IMAGE' && app.currentMedia.url && (!this.media || this.media.type==='NONE')) {
          this.media = { type: 'IMAGE', url: app.currentMedia.url };
        }
        if (!title && !content && (!this.media || this.media.type==='NONE')) { app.showToast('Nhập tiêu đề, nội dung hoặc thêm ảnh/video.', 'error'); return; }
        const res = await fetch('/api/community-groups/posts', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            group_id: this.currentGroupId,
            author_id: app.currentUser.id,
            title,
            content,
            media_type: this.media.type || 'NONE',
            media_url: this.media.url || ''
          })
        });
        const data = await res.json();
        if (data.status !== 'ok') { app.showToast(data.message || 'Không thể đăng', 'error'); return; }
        app.showToast(data.message || 'Đã gửi bài', 'success');
        document.getElementById('groupPostTitle').value = '';
        document.getElementById('groupPostContent').value = '';
        this.clearMedia();
        if (app.currentMedia) app.currentMedia = { type: 'NONE', url: '' };
        this.openGroup(this.currentGroupId);
      },

      async approvePost(postId, approve) {
        const res = await fetch('/api/community-groups/posts/approve', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ post_id: postId, admin_id: app.currentUser.id, approve })
        });
        const data = await res.json();
        if (data.status !== 'ok') { app.showToast(data.message || 'Lỗi', 'error'); return; }
        app.showToast(data.message, 'success');
        this.openGroup(this.currentGroupId);
      }
    };

    document.addEventListener('DOMContentLoaded', () => groupsPage.init());
  </script>
</body>
</html>
